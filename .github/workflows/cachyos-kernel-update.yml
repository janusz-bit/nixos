# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: cachyos-kernel-update
jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://janusz-bit.cachix.org
            extra-trusted-public-keys = janusz-bit.cachix.org-1:4stTiufAF02BAXw8HNvYslAmUlPbZPIRhIGht0gSMoo=
            build-fallback = true
      - name: Setup Cachix
        uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: janusz-bit
      - name: Update nix-cachyos-kernel flake input
        run: nix flake update nix-cachyos-kernel
      - name: Build Kernel
        run: nix build ".#nixosConfigurations.nixos.config.boot.kernelPackages.kernel^*" --show-trace --accept-flake-config
      - name: Commit updated flake.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet || git commit -m "flake.lock: update nix-cachyos-kernel"
          git push
name: cachyos-kernel-update
"on":
  workflow_dispatch: {}
permissions:
  contents: write
run-name: Update & Build CachyOS Kernel by @${{ github.actor }}
