# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: build-raspberry-pi-4-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://janusz-bit.cachix.org https://nix-on-droid.cachix.org
            extra-trusted-public-keys = janusz-bit.cachix.org-1:4stTiufAF02BAXw8HNvYslAmUlPbZPIRhIGht0gSMoo= nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU=
            build-fallback = true
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: janusz-bit
      - name: raspberry-pi-4
        run: nix build ".#nixosConfigurations.raspberry-pi-4.config.system.build.toplevel" --show-trace --accept-flake-config
name: raspberry-pi-4
"on":
  pull_request:
    branches:
      - master
  push:
    tags:
      - v*
  workflow_dispatch: {}
permissions:
  contents: read
run-name: Build raspberry-pi-4 by @${{ github.actor }}
