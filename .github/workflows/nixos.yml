# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: build-nixos-${{ github.ref }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = https://janusz-bit.cachix.org
            extra-trusted-public-keys = janusz-bit.cachix.org-1:4stTiufAF02BAXw8HNvYslAmUlPbZPIRhIGht0gSMoo=
            build-fallback = true
      - name: Setup Cachix
        uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: janusz-bit
      - name: nixos
        run: |-
          sha=${{ github.event.pull_request.head.sha || github.sha }}
          if git ls-remote --exit-code https://github.com/janusz-bit/nixpkgs-v3 "refs/tags/cached/nixos-$sha" >/dev/null; then
            nix build ".#nixosConfigurations.nixos.config.system.build.toplevel" --show-trace --accept-flake-config
          else
            missing=$(nix build ".#nixosConfigurations.nixos.config.system.build.toplevel" --dry-run --accept-flake-config 2>&1 | grep -c '\.drv$' || true)
            echo "::warning::janusz-bit/nixpkgs-v3 has no cached/nixos-$sha yet: $missing derivations are in no cache. Build them there: gh workflow run build.yml --repo janusz-bit/nixpkgs-v3 -f nixos_ref=$sha"
            echo "$missing derivations of nixos are not cached yet (janusz-bit/nixpkgs-v3, cached/nixos-$sha missing); build skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
name: nixos
"on":
  pull_request:
    branches:
      - master
  workflow_dispatch: {}
permissions:
  contents: read
run-name: Build nixos by @${{ github.actor }}
