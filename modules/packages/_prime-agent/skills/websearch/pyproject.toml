[project]
name = "prime-agent-skill-websearch"
version = "0.1.0"
description = "Web search skill for Prime Agent (DuckDuckGo via ddgs, no API key)."
requires-python = ">=3.10"
dependencies = ["ddgs>=9", "prime-agent-runtime"]

[project.scripts]
websearch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]
