[project]
name = "prime-agent-skill-nixos-mcp"
version = "0.1.0"
description = "NixOS integration skill for Prime Agent (local mcp-nixos stdio MCP server)."
requires-python = ">=3.10"
dependencies = ["mcp", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nixos_mcp"]
