[project]
name = "prime-agent-skill-trilium-notes"
version = "0.1.0"
description = "Trilium Notes integration skill for Prime Agent (built-in HTTP MCP server)."
requires-python = ">=3.10"
dependencies = ["mcp", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trilium_notes"]
